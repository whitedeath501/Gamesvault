<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>🎮 GameVault</h1>
        <nav>
            <a href="#inicio">Início</a>
            <a href="#catalogo">Catálogo</a>
            <a href="#recomendados">Recomendados</a>
            <a href="#favoritos">Favoritos</a>
        </nav>
    </header>

    <!-- INÍCIO -->
    <section id="inicio" class="banner">
        <h2>Bem-vindo ao GameVault!</h2>
        <p>Encontre jogos, dê sua nota e salve seus favoritos.</p>
        <h3>Destaque</h3>
        <div id="destaque"></div>
        <h3>Lançamentos</h3>
        <div id="lancamentos" class="lista"></div>
    </section>

    <!-- CATÁLOGO -->
    <section id="catalogo">
        <h2>Catálogo de jogos</h2>
        <div class="filtros">
            <input type="text" id="busca" placeholder="Pesquisar jogo...">
            <select id="genero">
                <option value="todos">Todos os gêneros</option>
            </select>
        </div>
        <div id="lista-jogos" class="lista"></div>
    </section>

    <!-- DETALHES -->
    <section id="detalhes" class="escondido">
        <h2>Detalhes</h2>
        <div id="conteudo-detalhes"></div>
        <button id="fechar-detalhes">Fechar</button>
    </section>

    <!-- RECOMENDADOS -->
    <section id="recomendados">
        <h2>Recomendados para você</h2>
        <p id="texto-reco"></p>
        <div id="lista-reco" class="lista"></div>
    </section>

    <!-- FAVORITOS -->
    <section id="favoritos">
        <h2>Meus favoritos</h2>
        <div id="lista-fav" class="lista"></div>
    </section>

    <footer>
        <p>Projeto GameVault - feito com HTML, CSS e JavaScript</p>
    </footer>

    <script src="js/jogos.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
